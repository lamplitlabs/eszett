plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.eszetttranslate'
version = '1.0.0'

android {
  namespace "expo.modules.eszetttranslate"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Google ML Kit on-device translation: the language packs (about 30 MB each) are downloaded once, then
  // everything runs on the phone.
  implementation 'com.google.mlkit:translate:17.0.3'
}
